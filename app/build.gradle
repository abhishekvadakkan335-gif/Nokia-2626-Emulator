plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retro.n2626'
    compileSdk 35

    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.retro.n2626'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '0.2'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libunicorn.so']
        }
    }
}
